name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Apple Silicon
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test lighting, protocol, and preview layout
        run: swift test

      - name: Build and archive app
        run: |
          ./Scripts/build-app.sh
          test "$(lipo -archs 'dist/K70 Studio.app/Contents/MacOS/K70Studio')" = arm64
          ditto -c -k --keepParent 'dist/K70 Studio.app' dist/K70-Studio-macOS-arm64.zip

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: K70-Studio-macOS-arm64
          path: dist/K70-Studio-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
